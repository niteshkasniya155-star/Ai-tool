<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Notes & Text Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center justify-center">
    <div class="max-w-md w-full bg-gray-800 p-6 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold text-center text-blue-400 mb-4">AI Text & Notes Summarizer</h1>
        <textarea id="inputText" rows="6" class="w-full p-3 bg-gray-700 rounded-lg text-white border border-gray-600 focus:outline-none" placeholder="Apna text ya notes yahan paste karein..."></textarea>
        <button onclick="summarizeText()" id="btn" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg">Summarize Now</button>
        <div id="output" class="mt-6 p-4 bg-gray-700 rounded-lg hidden">
            <h2 class="font-semibold text-green-400 mb-2">Summary Result:</h2>
            <p id="resultText" class="text-gray-200 text-sm whitespace-pre-line"></p>
        </div>
    </div>

    <script>
        // YAHAN APNI API KEY PASTE KAREIN
        const API_KEY = "AQ.Ab8RN6LyUWNEtsO9GSWeIIwHj3fsNgriCz9C7OfGkczqvZPPrw";

        async function summarizeText() {
            const text = document.getElementById('inputText').value;
            const btn = document.getElementById('btn');
            const output = document.getElementById('output');
            const resultText = document.getElementById('resultText');

            if (!text) return alert("Kripya pehle text enter karein!");

            btn.innerText = "Processing AI...";
            btn.disabled = true;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Provide a clear, bulleted summary of this text in simple language: " + text }] }]
                    })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                resultText.innerText = reply;
                output.classList.remove('hidden');
            } catch (err) {
                alert("Error generating summary. API key check karein.");
            } finally {
                btn.innerText = "Summarize Now";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
